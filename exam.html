/*

*/

let questions = [];

) || {};

/*
=========================================
YOUR TIMER
=========================================
*/

let timeRemaining = 60 * 60;

TIMER

*/

const timerInterval =

setInterval(() => {

    if(timeRemaining <= 0){

        clearInterval(
            timerInterval
        );

        submitExam(true);

    }else{

        timeRemaining--;

        let m =

        timeRemaining % 60;

        document.getElementById(
            "timer"
        ).innerText =

        `${m}:${s
        .toString()
        .padStart(2,'0')}`;
    }

},1000);

/*
=========================================
START CAMERA
=========================================
*/

async function startCamera(){

    const video =

    document.getElementById(
        "camera"
    );

    try{

        /*
        =================================
        CHECK SUPPORT
        =================================
        */

        if(

            !navigator.mediaDevices ||

            !navigator.mediaDevices.getUserMedia

        ){

            flag(
                "Camera unsupported"
            );

            return;
        }

        /*
        =================================
        REQUEST CAMERA
        =================================
        */

        const stream =

        await navigator
        .mediaDevices
        .getUserMedia({

            video:{

                facingMode:"user",

                width:{
                    ideal:320
                },

                height:{
                    ideal:240
                }

            },

            audio:false
        });

        /*
        =================================
        ATTACH STREAM
        =================================
        */

        video.srcObject = stream;

        /*
        =================================
        MOBILE SAFE
        =================================
        */

        video.setAttribute(
            "autoplay",
            true
        );

        video.setAttribute(
            "muted",
            true
        );

        video.setAttribute(
            "playsinline",
            true
        );

        /*
        =================================
        FORCE PLAY
        =================================
        */

        await video.play();

        console.log(
            "Camera active"
        );

        /*
        =================================
        LOAD AI MODELS
        =================================
        */

        await faceapi.nets
        .tinyFaceDetector
        .loadFromUri(

        'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/'

        );

        await faceapi.nets
        .faceLandmark68Net
        .loadFromUri(

        'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/'

        );

        

        /*
        =================================
        START LIGHTWEIGHT MOBILE DETECTION
        =================================
        */

        let isProcessingFace = false;
        let missingFaceCount = 0; // Grace period counter for mobile camera adjustments

        setInterval(async () => {

            // Halt if video isn't ready, already processing a frame, or models aren't loaded
            if (
                video.readyState !== 4 || 
                isProcessingFace || 
                !faceapi.nets.tinyFaceDetector.params
            ) {
                return;
            }

            try {
                isProcessingFace = true; // Lock frame

                // STRIPPED DOWN: No landmarks, tiny input matrix size for mobile speed
                const detections = await faceapi.detectAllFaces(
                    video, 
                    new faceapi.TinyFaceDetectorOptions({ 
                        inputSize: 128,        // Smallest matrix size = fast execution
                        scoreThreshold: 0.45   // Balanced sensitivity for mobile cameras
                    })
                ); // Removed .withFaceLandmarks() completely

                /*
                =============================
                STABILIZED MALPRACTICE MATH
                =============================
                */

                // 1. Presence Verification
                if (detections.length === 0) {
                    missingFaceCount++;
                    
                    // Only flag if the face is missing for 4 consecutive loops (20 full seconds)
                    if (missingFaceCount >= 4) {
                        flag("Jarvis AI: No face detected!");
                    }
                    
                    isProcessingFace = false;
                    return;
                }

                // Cleanly reset the counter the moment a face is found
                missingFaceCount = 0;

                // 2. Multiple Candidates Verification
                if (detections.length > 1) {
                    flag("Jarvis AI: Multiple faces detected!");
                    isProcessingFace = false;
                    return;
                }

            } catch (err) {
                console.log("Frame dropped safely to prevent lag:", err);
            } finally {
                isProcessingFace = false; // Safely unlock for the next 5-second interval
            }

        }, 5000);


    }catch(error){

        console.log(error);

        document.getElementById(
            "warn"
        ).innerText =

        "Jarvis AI: Camera access denied.";
    }
}

/*
=========================================
AUTO START
=========================================
*/

window.addEventListener(

    "load",

    async () => {

        /*
        =================================
        SAFE FULLSCREEN
        =================================
        */

        try{

            if(

                document
                .documentElement

            ){

                await document

                .requestFullscreen();

        /*
        =================================
        RUN THE QUESTION FETCH

});

/*
=========================================
LOAD QUESTIONS
=========================================
*/

async function loadData(){

    try{

        /*
        =====================================
        GET SUBJECT
        =====================================
        */

        const subjects = JSON.parse(
            localStorage.getItem(
                "todaysSubjects"
            )
        );

        if(
            !subjects ||
            !subjects.length
        ){

            document.getElementById(
                "qText"
            ).innerText =

            "No subject scheduled.";

            return;
        }

        /*
        =====================================
        FIRST SUBJECT
        =====================================
        */

        const sub =
        subjects[0];

        /*
        =====================================
        SUBJECT NAME
        =====================================
        */

        document.getElementById(
            "subjectBox"
        ).innerText =
        sub.subject;

        /*
        =====================================
        FETCH JSON
        =====================================
        */

        const res =
        await fetch(

`https://raw.githubusercontent.com/flexisystems2000/BECE-exams/main/${sub.file}?t=${Date.now()}`

        );

        /*
        =====================================
        FETCH FAILED
        =====================================
        */

        if(!res.ok){

            throw new Error(
                "Unable to fetch questions"
            );
        }

        /*
        =====================================
        JSON DATA
        =====================================
        */

        const data =
        await res.json();

        /*
        =====================================
        GET ACTUAL ARRAY DYNAMICALLY
        =====================================
        */

        if (Array.isArray(data)) {

            questions = data;

        } else {

            const arrayKey = 
            Object.keys(data)
            .find(key => 
                Array.isArray(data[key])
            );

            questions = 
            arrayKey 
            ? 
            data[arrayKey] 
            : 
            [];
        }

        /*
        =====================================
        EMPTY QUESTIONS
        =====================================
        */

        if(!questions.length){

            document.getElementById(
                "qText"
            ).innerText =

            "No questions found.";

            return;
        }

        /*
        =====================================
        RANDOMIZE
        =====================================
        */

        questions.sort(() =>
            Math.random() - 0.5
        );

        /*
        =====================================
        START RENDER
        =====================================
        */

        render();

    }catch(error){

        console.log(error);

        document.getElementById(
            "qText"
        ).innerText =

        "Error loading questions.";
    }
}



/*
=========================================
RENDER QUESTIONS
=========================================
*/

function render(){

    if(!questions.length){

        document.getElementById(
            "qText"
        ).innerText =

        "No questions available.";

        return;
    }

    const q =
    questions[cur];

    /*
    =====================================
    QUESTION TEXT
    =====================================
    */

    document.getElementById(
        "qText"
    ).innerText =

    `${cur + 1}. ${q.q}`;

    /*
    =====================================
    OPTIONS CONTAINER
    =====================================
    */

    const cont =

    document.getElementById(
        "optionsCont"
    );

    cont.innerHTML = "";

    /*
    =====================================
    OPTIONS ARRAY
    =====================================
    */

    const labels =
    ["A","B","C","D"];

    if(Array.isArray(q.o)){

        q.o.forEach((option,index)=>{

            const btn =
            document.createElement(
                "button"
            );

            btn.className =
            "optionBtn";

            btn.innerText =

            `${labels[index]}. ${option}`;

            btn.onclick = () => {

                answers[cur] = index;

                localStorage.setItem(

                    "examAnswers",

                    JSON.stringify(
                        answers
                    )
                );

                render();
            };

            /*
            =================================
            SELECTED STATE
            =================================
            */

            if(
                answers[cur] === index
            ){

                btn.classList.add(
                    "selected"
                );
            }

            cont.appendChild(btn);
        });

    }else{

        document.getElementById(
            "qText"
        ).innerText =

        "Invalid question format.";

        return;
    }

    /*
    =====================================
    QUESTION GRID
    =====================================
    */

    const tabs =

    document.getElementById(
        "tabGrid"
    );

    tabs.innerHTML = "";

    questions.forEach((_,i) => {

        const t =
        document.createElement(
            "button"
        );

        t.className =
        "tab-btn";

        /*
        =================================
        CURRENT QUESTION
        =================================
        */

        if(i === cur){

            t.classList.add(
                "active"
            );
        }

        /*
        =================================
        ANSWERED STATE
        =================================
        */

        if(
            answers[i] !== undefined
        ){

            t.classList.add(
                "answered"
            );
        }

        t.innerText = i + 1;

        t.onclick = () => {

            cur = i;

            render();
        };

        tabs.appendChild(t);
    });
}

/*
=========================================
NAVIGATION
=========================================
*/

function changeQ(dir){

    if(questions[cur + dir]){

        cur += dir;

        render();
    }
}

/*
=========================================
YOUR CALCULATOR
=========================================
*/

function toggleCalc(event){

    event.stopPropagation();

    const p =

    document.getElementById(
        "calcPanel"
    );

    p.style.display =

    p.style.display === "block"

    ?

    "none"

    :

    "block";
}

function append(v){

    document.getElementById(
        "calcInput"
    ).value += v;
}

function clearCalc(){

    document.getElementById(
        "calcInput"
    ).value = "";
}

function deleteChar(){

    let i =

    document.getElementById(
        "calcInput"
    );

    i.value =
    i.value.slice(0,-1);
}

function sin(x){

    return Math.sin(
        x * Math.PI / 180
    );
}

function cos(x){

    return Math.cos(
        x * Math.PI / 180
    );
}

function tan(x){

    return Math.tan(
        x * Math.PI / 180
    );
}

function sqrt(x){

    return Math.sqrt(x);
}

function solve(){

    const input =

    document.getElementById(
        "calcInput"
    );

    try{

        let exp =
        input.value;

        exp =
        exp.replace(/²/g,'**2');

        exp =
        exp.replace(/%/g,'/100');

        const open =

        (exp.match(/\(/g)||[])
        .length;

        const close =

        (exp.match(/\)/g)||[])
        .length;

        if(open > close){

            exp += ")"
            .repeat(open-close);
        }

        let result =
        eval(exp);

        if(

            result === Infinity ||

            isNaN(result)

        ){

            input.value = "Err";

        }else{

            input.value =

            parseFloat(
                result.toFixed(10)
            );
        }

    }catch(e){

        input.value = "Err";
    }
}

/*
=========================================
WARNING SYSTEM
=========================================
*/

/*
=========================================
SUBMIT TO FIRESTORE
=========================================
*/

async function submitExam(isForced){

    if(

        isForced ||

        confirm(
            "Are you sure you want to submit your examination?"
        )

    ){

        let score = 0;

        questions.forEach((q,index)=>{

    const correctAnswer =

    q.a ??
    q.answer ??
    q.correctAnswer ??
    "";

    if(

        answers[index] ===
        correctAnswer

    ){

        score++;
    }
});

        const percentage =

        (
            (score/questions.length)
            * 100
        ).toFixed(2);

        const candidateName =

        localStorage.getItem(
            "candidateName"
        ) || "Unknown";

        const candidatePhone =

        localStorage.getItem(
            "candidatePhone"
        ) || "Unknown";

        const subjectData =

        JSON.parse(

            localStorage.getItem(
                "todaysSubjects"
            )

        )?.[0];

        const subject =

        subjectData?.subject ||
        "Unknown";

        try{

            await db
            .collection("results")
            .add({

                candidateName,

                candidatePhone,

                subject,

                score,

                total:
                questions.length,

                percentage,

                malpractice,

                answers,

                submittedAt:
                firebase.firestore
                .FieldValue
                .serverTimestamp()

            });

            localStorage.setItem(
                "examSubmitted",
                "true"
            );

            localStorage.removeItem(
                "examAnswers"
            );

            showModal(

                "Submission Successful",

                "Your examination has been submitted successfully."

            );

        }catch(error){

            console.log(error);

            showModal(

                "Submission Failed",

                "Unable to submit your examination."

            );
        }
    }
}

/*
=========================================
MALPRACTICE DETECTION
=========================================
*/

document.addEventListener(

    "visibilitychange",

    () => {

        if(document.hidden){

            flag(
                "Tab or App switch detected!"
            );
        }
    }
);

document.addEventListener(

    "fullscreenchange",

    () => {

        if(

            !document
            .fullscreenElement

        ){

            flag(
                "Fullscreen exited!"
            );
        }
    }
);

/*
=========================================
BLOCK RIGHT CLICK
=========================================
*/

document.addEventListener(

    "contextmenu",

    e => e.preventDefault()
);

/*
=========================================
BLOCK COPYING
=========================================
*/

document.addEventListener(

    "copy",

    e => e.preventDefault()
);

/*
=========================================
BLOCK SHORTCUTS
=========================================
*/

document.addEventListener(

    "keydown",

    e => {

        if (

            e.key === "F12"

            ||

            (

                e.ctrlKey

                &&

                (
                    e.key === 'u'
                    ||
                    e.key === 'U'
                    ||
                    e.key === 'c'
                    ||
                    e.key === 'C'
                )
            )

        ){

            e.preventDefault();
        }
    }
);
